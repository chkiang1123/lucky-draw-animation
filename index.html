<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖公會白約翰會督中學 - 幸運扭蛋機</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #dcfce7 100%);
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Machine Styles */
        .machine-container {
            width: 320px;
            height: 520px;
            position: relative;
            margin: 0 auto;
            filter: drop-shadow(0 20px 25px rgba(0,0,0,0.15));
        }

        /* Glass Globe */
        .globe {
            width: 280px;
            height: 280px;
            background: rgba(255, 255, 255, 0.4);
            border: 8px solid #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 20px;
            z-index: 10;
            box-shadow: inset -15px -15px 30px rgba(0,0,0,0.1), inset 10px 10px 20px rgba(255,255,255,0.8);
            overflow: hidden;
        }

        /* Background Static Capsules in Globe */
        .static-capsules {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .mini-cap {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            position: absolute;
            box-shadow: inset -3px -3px 6px rgba(0,0,0,0.2);
        }

        /* Machine Base */
        .base {
            width: 320px;
            height: 260px;
            background: linear-gradient(180deg, #16a34a 0%, #15803d 100%);
            position: absolute;
            top: 260px;
            left: 0;
            border-radius: 20px 20px 10px 10px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 4px solid #14532d;
            box-shadow: inset 0 10px 20px rgba(255,255,255,0.2);
        }

        .brand-plate {
            background: #ffffff;
            color: #15803d;
            padding: 8px 16px;
            border-radius: 12px;
            margin-top: 15px;
            font-weight: 900;
            font-size: 1.1rem;
            text-align: center;
            border: 2px solid #bbf7d0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 80%;
        }

        /* Turn Knob */
        .knob-container {
            width: 80px;
            height: 80px;
            background: #e5e7eb;
            border-radius: 50%;
            margin-top: 20px;
            position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2), inset 0 4px 6px #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #9ca3af;
        }
        .knob {
            width: 60px;
            height: 20px;
            background: #ef4444;
            border-radius: 10px;
            box-shadow: 0 4px 4px rgba(0,0,0,0.2);
            transition: transform 0.5s ease-in-out;
        }
        .knob.turning {
            transform: rotate(360deg);
        }

        /* Dispenser Slot */
        .slot {
            width: 100px;
            height: 60px;
            background: #111827;
            border-radius: 50px 50px 10px 10px;
            position: absolute;
            bottom: 20px;
            box-shadow: inset 0 10px 15px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        .slot-door {
            width: 90px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 40px 40px 5px 5px;
            position: absolute;
            bottom: 5px;
            transform-origin: top;
            transition: transform 0.3s;
        }

        /* Dropping Capsule Animation */
        .drop-capsule {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            position: absolute;
            top: 200px;
            left: 135px;
            z-index: 8;
            opacity: 0;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.2);
        }
        .drop-capsule.dropping {
            animation: dropAnim 1s ease-in forwards;
        }

        @keyframes dropAnim {
            0% { top: 200px; opacity: 1; transform: scale(1); }
            50% { top: 270px; opacity: 1; transform: scale(0.9); }
            70% { top: 440px; opacity: 1; transform: scale(0.9); }
            90% { top: 430px; opacity: 1; transform: scale(0.95); }
            100% { top: 445px; opacity: 1; transform: scale(0.9); }
        }

        /* Full Screen Result Overlay */
        #result-overlay {
            backdrop-filter: blur(8px);
            background: rgba(0, 0, 0, 0.7);
            z-index: 50;
        }

        /* Big Animated Capsule */
        .big-capsule {
            width: 140px;
            height: 180px;
            position: relative;
            margin: 0 auto;
            transform-origin: center;
        }
        .big-cap-half {
            width: 140px;
            height: 90px;
            position: absolute;
            left: 0;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.15);
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .big-cap-top {
            top: 0;
            background: #ef4444;
            border-radius: 70px 70px 0 0;
            z-index: 3;
        }
        .big-cap-bottom {
            bottom: 0;
            background: #ffffff;
            border-radius: 0 0 70px 70px;
            z-index: 1;
            border-top: 4px solid #e5e7eb;
        }
        
        .prize-paper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: #fffbea;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 2;
            width: 250px;
            border: 2px dashed #f59e0b;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition-delay: 0.4s;
        }

        /* Animation States */
        .big-capsule.shake {
            animation: shake 0.5s ease-in-out 2;
        }
        .big-capsule.open .big-cap-top {
            transform: translateY(-80px) rotate(-15deg);
        }
        .big-capsule.open .big-cap-bottom {
            transform: translateY(80px) rotate(15deg);
        }
        .big-capsule.open .prize-paper {
            transform: translate(-50%, -50%) scale(1);
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg) translate(0, 0); }
            25% { transform: rotate(5deg) translate(5px, 5px); }
            50% { transform: rotate(-5deg) translate(-5px, -5px); }
            75% { transform: rotate(5deg) translate(-5px, 5px); }
        }

        .btn-draw {
            background: linear-gradient(180deg, #fcd34d 0%, #f59e0b 100%);
            box-shadow: 0 6px 0 #d97706, 0 15px 20px rgba(0,0,0,0.2);
            transition: all 0.1s;
        }
        .btn-draw:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #d97706, 0 5px 10px rgba(0,0,0,0.2);
        }
        .btn-draw:disabled {
            filter: grayscale(100%);
            cursor: not-allowed;
            transform: translateY(6px);
            box-shadow: 0 0px 0 #d97706;
        }

        /* Keypad button press effect */
        .key-btn:active, .key-btn-del:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header -->
    <div class="text-center mb-8">
        <h1 class="text-3xl md:text-4xl font-black text-green-800 drop-shadow-md tracking-wider">SKHBBSS</h1>
        <h2 class="text-xl md:text-2xl font-bold text-green-700 mt-2">聖公會白約翰會督中學<br>幸運扭蛋抽獎</h2>
    </div>

    <!-- Machine -->
    <div class="machine-container">
        <div class="globe" id="globe">
            <div class="static-capsules" id="static-capsules"></div>
        </div>
        
        <div class="base">
            <div class="brand-plate shadow-inner">
                SKHBBSS GASHAPON
            </div>
            
            <div class="knob-container">
                <div class="knob" id="knob"></div>
            </div>

            <div class="slot">
                <div class="slot-door"></div>
            </div>
        </div>

        <div class="drop-capsule" id="drop-capsule" style="background: linear-gradient(180deg, #ef4444 50%, #ffffff 50%);"></div>
    </div>

    <!-- Controls -->
    <div class="mt-12 text-center w-full max-w-sm">
        <button id="draw-btn" class="btn-draw w-full text-2xl font-bold text-amber-900 py-4 px-8 rounded-full border-4 border-yellow-200 uppercase tracking-widest relative overflow-hidden">
            <span class="relative z-10">開始抽獎 Draw Prize</span>
        </button>
        <p class="text-xs text-green-800 mt-4 font-semibold">每次抽獎將自動記錄於 Google Sheet</p>
    </div>

    <!-- Result Overlay -->
    <div id="result-overlay" class="fixed inset-0 hidden flex-col items-center justify-center">
        <div class="big-capsule" id="big-capsule">
            <div class="big-cap-half big-cap-top" id="big-cap-top"></div>
            <div class="big-cap-half big-cap-bottom"></div>
            
            <div class="prize-paper">
                <p class="text-sm text-gray-500 font-bold mb-1">恭喜您獲得</p>
                <h3 id="prize-name" class="text-2xl font-black text-green-700 mb-2 leading-tight"></h3>
                <p id="prize-desc" class="text-xs text-gray-400"></p>
            </div>
        </div>

        <button id="close-result-btn" class="mt-20 bg-white text-green-700 font-bold py-3 px-8 rounded-full shadow-lg border-2 border-green-500 opacity-0 transition-opacity duration-500 hover:bg-green-50">
            領取獎品並關閉
        </button>
    </div>

    <!-- Keypad Modal (Pops up for Cash Coupon Winners) -->
    <div id="keypad-modal" class="fixed inset-0 hidden items-center justify-center p-4 z-[60] backdrop-blur-sm bg-black/80">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl flex flex-col items-center border-4 border-green-500">
            <h3 class="text-xl font-black text-green-800 mb-1">請輸入班別及學號</h3>
            <p class="text-xs text-gray-500 mb-4 text-center">領取現金券必須記錄資料 (例: 3A12)</p>
            
            <!-- Input Display -->
            <div class="w-full bg-gray-100 border-2 border-gray-300 rounded-xl h-16 mb-4 flex items-center justify-center text-3xl font-black tracking-widest text-gray-800 shadow-inner" id="keypad-display">
            </div>

            <!-- Keypad Grid (0-9, A-D) -->
            <div class="grid grid-cols-4 gap-2 w-full mb-4">
                <button class="key-btn bg-gray-100 hover:bg-gray-200 border-b-4 border-gray-300 text-xl font-black py-4 rounded-xl transition-all">1</button>
                <button class="key-btn bg-gray-100 hover:bg-gray-200 border-b-4 border-gray-300 text-xl font-black py-4 rounded-xl transition-all">2</button>
                <button class="key-btn bg-gray-100 hover:bg-gray-200 border-b-4 border-gray-300 text-xl font-black py-4 rounded-xl transition-all">3</button>
                <button class="key-btn bg-blue-100 hover:bg-blue-200 border-b-4 border-blue-300 text-blue-800 text-xl font-black py-4 rounded-xl transition-all">A</button>
                
                <button class="key-btn bg-gray-100 hover:bg-gray-200 border-b-4 border-gray-300 text-xl font-black py-4 rounded-xl transition-all">4</button>
                <button class="key-btn bg-gray-100 hover:bg-gray-200 border-b-4 border-gray-300 text-xl font-black py-4 rounded-xl transition-all">5</button>
                <button class="key-btn bg-gray-100 hover:bg-gray-200 border-b-4 border-gray-300 text-xl font-black py-4 rounded-xl transition-all">6</button>
                <button class="key-btn bg-blue-100 hover:bg-blue-200 border-b-4 border-blue-300 text-blue-800 text-xl font-black py-4 rounded-xl transition-all">B</button>
                
                <button class="key-btn bg-gray-100 hover:bg-gray-200 border-b-4 border-gray-300 text-xl font-black py-4 rounded-xl transition-all">7</button>
                <button class="key-btn bg-gray-100 hover:bg-gray-200 border-b-4 border-gray-300 text-xl font-black py-4 rounded-xl transition-all">8</button>
                <button class="key-btn bg-gray-100 hover:bg-gray-200 border-b-4 border-gray-300 text-xl font-black py-4 rounded-xl transition-all">9</button>
                <button class="key-btn bg-blue-100 hover:bg-blue-200 border-b-4 border-blue-300 text-blue-800 text-xl font-black py-4 rounded-xl transition-all">C</button>
                
                <button class="key-btn-del bg-red-100 hover:bg-red-200 border-b-4 border-red-300 text-red-600 text-lg font-black py-4 rounded-xl transition-all">刪除</button>
                <button class="key-btn bg-gray-100 hover:bg-gray-200 border-b-4 border-gray-300 text-xl font-black py-4 rounded-xl transition-all col-span-2">0</button>
                <button class="key-btn bg-blue-100 hover:bg-blue-200 border-b-4 border-blue-300 text-blue-800 text-xl font-black py-4 rounded-xl transition-all">D</button>
            </div>
            
            <button id="keypad-submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-[0_6px_0_#166534] active:shadow-[0_0px_0_#166534] active:translate-y-[6px] transition-all text-xl uppercase">確認 Confirm</button>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxQMjtjWzf9eEGNkzRc8jrGO8gRXz9o2dgMfubtL-SlSV5RTMz5Z9Wep-R7SnVnISZE/exec";

        const drawBtn = document.getElementById('draw-btn');
        const knob = document.getElementById('knob');
        const dropCapsule = document.getElementById('drop-capsule');
        const resultOverlay = document.getElementById('result-overlay');
        const bigCapsule = document.getElementById('big-capsule');
        const bigCapTop = document.getElementById('big-cap-top');
        const prizeNameEl = document.getElementById('prize-name');
        const prizeDescEl = document.getElementById('prize-desc');
        const closeResultBtn = document.getElementById('close-result-btn');
        const staticCapsulesContainer = document.getElementById('static-capsules');

        // Keypad Elements
        const keypadModal = document.getElementById('keypad-modal');
        const keypadDisplay = document.getElementById('keypad-display');
        const keypadSubmit = document.getElementById('keypad-submit');
        const keys = document.querySelectorAll('.key-btn');
        const delKey = document.querySelector('.key-btn-del');

        let isAnimating = false;
        let currentPrize = null;
        let classInputValue = "";

        // Odds: 50% Random Souvenir, 25% HKD $8 Coupon, 25% Specific Souvenir
        const PRIZES = [
            { id: 'random_souvenir', name: '隨機BBSS紀念品一份', prob: 50, color: '#f87171', desc: '充滿驚喜的學校紀念品！' },
            { id: 'coupon_8', name: '一張HKD $8學校小食部現金券', prob: 25, color: '#34d399', desc: '可用於學校小食部購買美食！' },
            { id: 'specific_souvenir', name: '可指定BBSS紀念品一份', prob: 25, color: '#60a5fa', desc: '自由選擇您心儀的紀念品！' }
        ];

        const CAPSULE_COLORS = ['#f87171', '#34d399', '#60a5fa', '#fbbf24', '#a78bfa', '#f472b6'];

        function populateGlobe() {
            for (let i = 0; i < 40; i++) {
                const cap = document.createElement('div');
                cap.className = 'mini-cap';
                const color = CAPSULE_COLORS[Math.floor(Math.random() * CAPSULE_COLORS.length)];
                cap.style.background = `linear-gradient(180deg, ${color} 50%, #ffffff 50%)`;
                
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 110;
                const x = 140 + radius * Math.cos(angle) - 20;
                const y = 140 + radius * Math.sin(angle) - 20;
                
                cap.style.left = `${x}px`;
                cap.style.top = `${y}px`;
                cap.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                staticCapsulesContainer.appendChild(cap);
            }
        }
        populateGlobe();

        function determinePrize() {
            const rand = Math.random() * 100;
            let cumulative = 0;
            for (let prize of PRIZES) {
                cumulative += prize.prob;
                if (rand < cumulative) {
                    return prize;
                }
            }
            return PRIZES[0];
        }

        function saveToGoogleSheet(prize, studentInfo = "") {
            const timestamp = new Date().toLocaleString('zh-HK', { timeZone: 'Asia/Hong_Kong' });
            
            // Merges the typed class string directly into the Prize Name so you don't have to edit Google Apps Script
            let finalPrizeName = prize.name;
            if (studentInfo !== "") {
                finalPrizeName = `${prize.name} (得獎者: ${studentInfo})`;
            }
            
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8",
                },
                body: JSON.stringify({
                    prize: finalPrizeName,
                    prize_name: finalPrizeName,
                    prize_id: prize.id,
                    school: "SKHBBSS",
                    timestamp: timestamp
                })
            })
            .then(() => console.log("Google Sheet 請求已送出！"))
            .catch(err => console.error("Google Sheet 發送失敗:", err));
        }

        function triggerConfetti() {
            const duration = 3 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }
                const particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        // --- DRAW SEQUENCE ---
        drawBtn.addEventListener('click', () => {
            if (isAnimating) return;
            isAnimating = true;
            drawBtn.disabled = true;
            
            currentPrize = determinePrize();
            
            dropCapsule.style.background = `linear-gradient(180deg, ${currentPrize.color} 50%, #ffffff 50%)`;
            bigCapTop.style.background = currentPrize.color;
            prizeNameEl.textContent = currentPrize.name;
            prizeDescEl.textContent = currentPrize.desc;

            knob.classList.add('turning');
            
            setTimeout(() => {
                dropCapsule.classList.add('dropping');
            }, 300);

            setTimeout(() => {
                knob.classList.remove('turning');
                dropCapsule.classList.remove('dropping');
                dropCapsule.style.opacity = '0';
                
                resultOverlay.classList.remove('hidden');
                resultOverlay.classList.add('flex');
                
                bigCapsule.classList.add('shake');
                
                setTimeout(() => {
                    bigCapsule.classList.remove('shake');
                    bigCapsule.classList.add('open');
                    
                    setTimeout(() => {
                        triggerConfetti();
                        
                        // Condition: If it's a cash coupon, change button text and DON'T auto save yet
                        if (currentPrize.id === 'coupon_8') {
                            closeResultBtn.innerText = "輸入班別領取獎品";
                            closeResultBtn.classList.remove('bg-white', 'text-green-700');
                            closeResultBtn.classList.add('bg-green-600', 'text-white', 'border-none');
                        } else {
                            closeResultBtn.innerText = "領取獎品並關閉";
                            closeResultBtn.classList.add('bg-white', 'text-green-700');
                            closeResultBtn.classList.remove('bg-green-600', 'text-white', 'border-none');
                            
                            // It's a standard prize, save automatically in background
                            saveToGoogleSheet(currentPrize);
                        }
                        
                        closeResultBtn.style.opacity = '1';
                    }, 400);
                }, 1000);

            }, 1400);
        });

        // --- RESULT OVERLAY CLOSE ACTION ---
        closeResultBtn.addEventListener('click', () => {
            if (currentPrize && currentPrize.id === 'coupon_8') {
                // Open keypad modal for cash coupon winners
                keypadModal.classList.remove('hidden');
                keypadModal.classList.add('flex');
            } else {
                // Normal close
                resetMachine();
            }
        });

        // --- KEYPAD LOGIC ---
        keys.forEach(key => {
            key.addEventListener('click', () => {
                // Limit to 5 characters (e.g. 5A123)
                if (classInputValue.length < 5) {
                    classInputValue += key.innerText;
                    keypadDisplay.innerText = classInputValue;
                }
            });
        });

        delKey.addEventListener('click', () => {
            classInputValue = classInputValue.slice(0, -1);
            keypadDisplay.innerText = classInputValue;
        });

        keypadSubmit.addEventListener('click', () => {
            if (classInputValue.length < 3) {
                alert("請輸入完整的班別及學號 (例: 3A12)");
                return;
            }
            
            // Save to Google Sheet with class input
            saveToGoogleSheet(currentPrize, classInputValue);
            
            // Close Everything
            keypadModal.classList.add('hidden');
            keypadModal.classList.remove('flex');
            
            // Reset input for next time
            classInputValue = "";
            keypadDisplay.innerText = "";
            
            resetMachine();
        });

        function resetMachine() {
            resultOverlay.classList.add('hidden');
            resultOverlay.classList.remove('flex');
            
            bigCapsule.classList.remove('open');
            closeResultBtn.style.opacity = '0';
            dropCapsule.style.opacity = '1';
            
            isAnimating = false;
            drawBtn.disabled = false;
            currentPrize = null;
        }
    </script>
</body>
</html>
